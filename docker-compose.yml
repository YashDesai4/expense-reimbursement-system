services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: expenses, POSTGRES_USER: expenses, POSTGRES_PASSWORD: expenses }
    volumes: ["expense_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U expenses"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://expenses:expenses@db:5432/expenses
      JWT_SECRET: replace-this-secret
      DONUT_MODEL_PATH: ${DONUT_MODEL_PATH:-}
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  ui:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  expense_data:
