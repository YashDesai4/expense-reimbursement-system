[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expense-reimbursement-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
ml = ["torch>=2.4,<3", "transformers>=4.45,<5", "pillow>=10,<12", "datasets>=3,<4", "accelerate>=1,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
